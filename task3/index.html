<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>WASM Image Filter</title>
    <style>
        canvas {
            border: 1px solid #ccc;
            display: block;
            margin-top: 10px;
        }

        button {
            margin-right: 10px;
        }

        /* checkbox grid */
        #yard {
            display: grid;
            grid-template-columns: repeat(40, 18px);
            gap: 6px;
            margin-top: 12px;
        }

        #yard input {
            width: 16px;
            height: 16px;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        /* hover effect class */
        #yard input.hovered {
            outline: 2px solid orange;
            background-color: yellow;
        }

        .image-container {
            position: relative;
            display: block;
            width: fit-content;
            margin-top: 10px;
        }

        #hash-output {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 6px 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            font-weight: bold;
            z-index: 1;
        }
    </style>
</head>

<body>
    <h1>Image Filter (WASM + Web Worker)</h1>
    <input type="file" id="upload" accept="image/*" />
    <br />
    <br />
    <button onclick="applyFilter('transform1')">Transform 1</button>
    <button onclick="applyFilter('transform2')">Transform 2</button>
    <button onclick="applyFilter('transform3')">Transform 3</button>
    <button onclick="applyFilter('transform4')">Transform 4</button>
    <div class="image-container">
        <canvas id="canvas"></canvas>
        <output id="hash-output" aria-live="polite"></output>
    </div>
    <br />
    <button onclick="callFourthActivity()">Generate SHA-256 hash</button>

    <script src="main.js"></script>

    <div style="margin-top:10px;">
        <strong>Click test:</strong>
        Clicks: <span id="clicks">0</span>
        <div id="yard" aria-label="Click test grid"></div>
    </div>


    <script>
        (function () {
            const yard = document.getElementById('yard');
            const clicksEl = document.getElementById('clicks');
            if (!yard) return;

            const cols = 40, rows = 3;
            let clicks = 0;
            const frag = document.createDocumentFragment();

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.addEventListener('click', () => {
                        clicksEl.textContent = String(++clicks);
                    });
                    frag.appendChild(cb);
                }
            }
            yard.appendChild(frag);
        })();
    </script>


    <canvas id="paint" width="500" height="500"></canvas>
    <script>
        (function () {
            const canvas = document.getElementById('paint');
            const ctx = canvas.getContext('2d');
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#2b6';
            ctx.lineWidth = 6;

            // paint without mouse down
            let last = null;

            function getPos(evt) {
                const rect = canvas.getBoundingClientRect();
                return {
                    x: (evt.clientX - rect.left) * (canvas.width / rect.width),
                    y: (evt.clientY - rect.top) * (canvas.height / rect.height),
                };
            }

            canvas.addEventListener('mousemove', (e) => {
                const p = getPos(e);
                if (last) {
                    ctx.beginPath();
                    ctx.moveTo(last.x, last.y);
                    ctx.lineTo(p.x, p.y);
                    ctx.stroke();
                } else {
                    // draw a dot for the first move
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, ctx.lineWidth / 2, 0, Math.PI * 2);
                    ctx.fillStyle = ctx.strokeStyle;
                    ctx.fill();
                }
                last = p;
            });

            canvas.addEventListener('mouseleave', () => { last = null; });
            canvas.addEventListener('mouseenter', () => { last = null; });

            // optional: clear on double click
            canvas.addEventListener('dblclick', () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            });
        })();
    </script>


</body>

</html>
